plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.xoarena'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.xoarena'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
}
